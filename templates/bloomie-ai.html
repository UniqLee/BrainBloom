<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask Bloomie</title>
</head>
<body>
  <h1>Ask Bloomie</h1>

  <form method="POST" action="/bloomie-ai">
    <input
      id="question"
      name="question"
      type="text"
      placeholder="Ask Bloomie anything..."
      required
      value="{{ question if question else '' }}"
    >
    <button type="submit">Ask</button>
  </form>

  {% if answer %}
    <div id="bloomie-response">
      <h3>Bloomie says:</h3>
      <p>{{ answer }}</p>
    </div>
  {% endif %}
</body>
</html>
